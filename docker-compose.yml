version: "3.9"

services:
  vocalu_database:
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - vocalu_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
    vocalu_data:
